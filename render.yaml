# Blueprint Render : un seul service web (serveur de jeu + client statique).
# Le serveur de jeu est un processus à état : ne PAS augmenter numInstances.
services:
  - type: web
    name: createyourcity
    runtime: node
    # Une instance qui ne s'endort pas est nécessaire pour une simulation continue 24 h/24
    # (les instances gratuites s'arrêtent après 15 min sans trafic entrant).
    plan: starter
    numInstances: 1
    # Francfort : au plus près des joueurs européens (la région ne se change plus après création ;
    # choisissez la même zone que le projet Supabase).
    region: frankfurt
    # Le build compile le client (Vite, fichiers précompressés Brotli/gzip) et le serveur (esbuild).
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    # Node directement (pas npm) : le signal d'arrêt arrive au serveur, qui sauvegarde avant de quitter.
    # Tas limité sous les 512 Mo de l'instance Starter pour que le ramasse-miettes agisse avant l'OOM.
    startCommand: node --enable-source-maps --max-old-space-size=400 server/dist/index.js
    healthCheckPath: /health
    # Laisse le temps à la sauvegarde finale lors d'un redéploiement.
    maxShutdownDelaySeconds: 60
    # Pas de redéploiement pour une modification de documentation ou des outils de bande-annonce.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - scripts/trailer/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: no-verify
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: MAX_CATCHUP_HOURS
        value: "24"
